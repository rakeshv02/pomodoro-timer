<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Pomodoro Timer Online — Tabutility</title>
<meta name="description" content="Free Pomodoro timer online. 25-minute focus sessions with 5-minute breaks. Customisable and tracks your sessions."/>

<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-78VZWJ5B1W');</script>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

<style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f172a;color:#f1f5f9;min-height:100vh}nav{background:#1e293b;border-bottom:1px solid #334155;padding:14px 24px;display:flex;align-items:center;gap:16px}nav a{color:#94a3b8;text-decoration:none;font-size:14px}nav a:hover{color:#f1f5f9}nav .brand{color:#38bdf8;font-weight:700;font-size:18px}.ad-banner{background:#1e293b;border-bottom:1px solid #334155;padding:8px;text-align:center}</style>

<body>
<nav><span class="brand">⚡ Tabutility</span><a href="https://tabutility.com">← All Tools</a></nav>
<div class="ad-banner"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-7039091592734005" data-ad-slot="auto" data-ad-format="auto" data-full-width-responsive="true"></ins><script>(adsbygoogle=window.adsbygoogle||[]).push({});</script></div>
<div id="root"></div>
<script type="text/babel">
//<![CDATA[
const { useState, useEffect, useRef } = React;

const MODES = { work: 'Focus', short: 'Short Break', long: 'Long Break' };
const COLORS = { work: '#ef4444', short: '#22c55e', long: '#38bdf8' };

function beep(ctx, freq = 660, dur = 0.15, delay = 0) {
  const o = ctx.createOscillator();
  const g = ctx.createGain();
  o.connect(g); g.connect(ctx.destination);
  o.frequency.value = freq;
  g.gain.setValueAtTime(0.4, ctx.currentTime + delay);
  g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + dur);
  o.start(ctx.currentTime + delay);
  o.stop(ctx.currentTime + delay + dur);
}

function playDone(ctx) {
  beep(ctx, 523, 0.15, 0);
  beep(ctx, 659, 0.15, 0.2);
  beep(ctx, 784, 0.3, 0.4);
}

export default function Pomodoro() {
  const [settings, setSettings] = useState({ work: 25, short: 5, long: 15, longAfter: 4 });
  const [editing, setEditing] = useState(false);
  const [mode, setMode] = useState('work');
  const [remaining, setRemaining] = useState(25 * 60);
  const [running, setRunning] = useState(false);
  const [sessions, setSessions] = useState(0);
  const [completedToday, setCompletedToday] = useState(0);
  const audioRef = useRef(null);
  const intervalRef = useRef(null);

  const getCtx = () => { if (!audioRef.current) audioRef.current = new AudioContext(); return audioRef.current; };

  const totalFor = (m) => settings[m] * 60;

  useEffect(() => {
    if (running) {
      intervalRef.current = setInterval(() => {
        setRemaining(r => {
          if (r <= 1) {
            clearInterval(intervalRef.current);
            setRunning(false);
            try { playDone(getCtx()); } catch(e) {}
            if (mode === 'work') {
              const next = sessions + 1;
              setSessions(next);
              setCompletedToday(c => c + 1);
              const nextMode = next % settings.longAfter === 0 ? 'long' : 'short';
              setMode(nextMode);
              setRemaining(totalFor(nextMode));
            } else {
              setMode('work');
              setRemaining(totalFor('work'));
            }
            return 0;
          }
          return r - 1;
        });
      }, 1000);
    }
    return () => clearInterval(intervalRef.current);
  }, [running, mode, sessions, settings]);

  const total = totalFor(mode);
  const pct = ((total - remaining) / total) * 100;
  const min = Math.floor(remaining / 60);
  const sec = remaining % 60;
  const color = COLORS[mode];
  const r = 120; const circ = 2 * Math.PI * r;

  const switchMode = (m) => { clearInterval(intervalRef.current); setRunning(false); setMode(m); setRemaining(totalFor(m)); };

  return (
    <div style={{maxWidth:560,margin:'40px auto',padding:'0 20px'}}>
      <h1 style={{textAlign:'center',fontSize:28,fontWeight:700,marginBottom:8}}>Pomodoro Timer</h1>
      <p style={{textAlign:'center',color:'#94a3b8',marginBottom:24}}>Focus sessions · Short & long breaks · Session tracking</p>

      <div style={{display:'flex',gap:8,justifyContent:'center',marginBottom:24}}>
        {Object.keys(MODES).map(m => (
          <button key={m} onClick={() => switchMode(m)} style={{background:mode===m?color:'#1e293b',color:mode===m?'#fff':'#94a3b8',border:`1px solid ${mode===m?color:'#334155'}`,borderRadius:10,padding:'8px 18px',fontSize:14,fontWeight:600,cursor:'pointer'}}>{MODES[m]}</button>
        ))}
      </div>

      <div style={{background:'#1e293b',borderRadius:20,padding:'32px 24px',textAlign:'center',border:'1px solid #334155',marginBottom:24}}>
        <svg width="280" height="280" style={{display:'block',margin:'0 auto 24px'}}>
          <circle cx="140" cy="140" r={r} fill="none" stroke="#334155" strokeWidth="10"/>
          <circle cx="140" cy="140" r={r} fill="none" stroke={color} strokeWidth="10"
            strokeDasharray={circ} strokeDashoffset={circ - (circ * pct / 100)}
            strokeLinecap="round" transform="rotate(-90 140 140)" style={{transition:'stroke-dashoffset 0.9s linear'}}/>
          <text x="140" y="155" textAnchor="middle" fill="#f1f5f9" fontSize="64" fontFamily="monospace" fontWeight="300">
            {`${String(min).padStart(2,'0')}:${String(sec).padStart(2,'0')}`}
          </text>
          <text x="140" y="185" textAnchor="middle" fill={color} fontSize="15" fontWeight="600">{MODES[mode].toUpperCase()}</text>
        </svg>

        <div style={{display:'flex',gap:12,justifyContent:'center',marginBottom:20}}>
          {!running
            ? <button onClick={() => setRunning(true)} style={{background:color,color:'#fff',border:'none',borderRadius:12,padding:'14px 40px',fontSize:18,fontWeight:700,cursor:'pointer'}}>Start</button>
            : <button onClick={() => { clearInterval(intervalRef.current); setRunning(false); }} style={{background:'#334155',color:'#f1f5f9',border:'none',borderRadius:12,padding:'14px 40px',fontSize:18,fontWeight:700,cursor:'pointer'}}>Pause</button>
          }
          <button onClick={() => { clearInterval(intervalRef.current); setRunning(false); setRemaining(totalFor(mode)); }} style={{background:'#1e293b',color:'#94a3b8',border:'1px solid #334155',borderRadius:12,padding:'14px 24px',fontSize:18,fontWeight:700,cursor:'pointer'}}>↺</button>
        </div>

        <div style={{display:'flex',gap:24,justifyContent:'center'}}>
          <div style={{textAlign:'center'}}>
            <div style={{fontSize:28,fontWeight:700,color:color}}>{sessions % settings.longAfter || (sessions > 0 && sessions % settings.longAfter === 0 ? settings.longAfter : 0)}</div>
            <div style={{fontSize:12,color:'#64748b'}}>pomodoros this cycle</div>
          </div>
          <div style={{textAlign:'center'}}>
            <div style={{fontSize:28,fontWeight:700,color:'#f1f5f9'}}>{completedToday}</div>
            <div style={{fontSize:12,color:'#64748b'}}>completed today</div>
          </div>
          <div style={{textAlign:'center'}}>
            <div style={{fontSize:28,fontWeight:700,color:'#f1f5f9'}}>{Math.floor(completedToday * settings.work)} <span style={{fontSize:14,color:'#64748b'}}>min</span></div>
            <div style={{fontSize:12,color:'#64748b'}}>focused today</div>
          </div>
        </div>
      </div>

      <div style={{background:'#1e293b',borderRadius:16,padding:20,border:'1px solid #334155'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
          <h2 style={{fontSize:16,fontWeight:600}}>Settings</h2>
          <button onClick={() => setEditing(e => !e)} style={{background:'#334155',color:'#f1f5f9',border:'none',borderRadius:8,padding:'6px 14px',fontSize:13,cursor:'pointer'}}>{editing ? 'Close' : 'Edit'}</button>
        </div>
        {editing ? (
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
            {[['work','Focus (min)'],['short','Short break (min)'],['long','Long break (min)'],['longAfter','Long break after']].map(([k,label]) => (
              <label key={k} style={{fontSize:13,color:'#94a3b8'}}>
                {label}
                <input type="number" min="1" max="120" value={settings[k]}
                  onChange={e => { const v = parseInt(e.target.value)||1; setSettings(s => ({...s,[k]:v})); if(k===mode){setRemaining(v*60);}}}
                  style={{display:'block',width:'100%',marginTop:4,background:'#0f172a',color:'#f1f5f9',border:'1px solid #334155',borderRadius:8,padding:'8px',fontSize:16}}/>
              </label>
            ))}
          </div>
        ) : (
          <div style={{display:'flex',gap:16,fontSize:14,color:'#94a3b8'}}>
            <span>Focus: <strong style={{color:'#f1f5f9'}}>{settings.work}m</strong></span>
            <span>Short break: <strong style={{color:'#f1f5f9'}}>{settings.short}m</strong></span>
            <span>Long break: <strong style={{color:'#f1f5f9'}}>{settings.long}m</strong></span>
            <span>Every: <strong style={{color:'#f1f5f9'}}>{settings.longAfter}</strong></span>
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Pomodoro />);
//]]>
</script>
</body>
</html>
