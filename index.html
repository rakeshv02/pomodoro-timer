<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Pomodoro Timer Online — Tabutility</title>
<meta name="description" content="Free Pomodoro timer online. 25-minute focus sessions with 5-minute breaks. Customisable and tracks your sessions."/>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f172a;color:#f1f5f9;min-height:100vh}
nav{background:#1e293b;border-bottom:1px solid #334155;padding:14px 24px;display:flex;align-items:center;gap:16px}
nav a{color:#94a3b8;text-decoration:none;font-size:14px}nav a:hover{color:#f1f5f9}
nav .brand{color:#38bdf8;font-weight:700;font-size:18px}
.ad-banner{background:#1e293b;border-bottom:1px solid #334155;padding:8px;text-align:center}
#app{max-width:520px;margin:40px auto;padding:0 20px}
h1{font-size:28px;font-weight:700;text-align:center;margin-bottom:8px}
.subtitle{text-align:center;color:#94a3b8;margin-bottom:24px}
.mode-tabs{display:flex;gap:8px;justify-content:center;margin-bottom:24px}
.mode-tab{border-radius:10px;padding:8px 18px;font-size:14px;font-weight:600;cursor:pointer;border:1px solid #334155;background:#1e293b;color:#94a3b8;transition:all .15s}
.card{background:#1e293b;border-radius:20px;padding:32px 24px;text-align:center;border:1px solid #334155;margin-bottom:20px}
#ring-svg{display:block;margin:0 auto 20px}
.stats-row{display:flex;gap:24px;justify-content:center;margin-bottom:0}
.stat{text-align:center}
.stat-num{font-size:28px;font-weight:700}
.stat-lbl{font-size:12px;color:#64748b;margin-top:2px}
.btns{display:flex;gap:12px;justify-content:center;margin-bottom:20px}
.btn{border:none;border-radius:12px;padding:14px 40px;font-size:17px;font-weight:700;cursor:pointer}
.btn-secondary{background:#334155;color:#f1f5f9}
.settings-card{background:#1e293b;border-radius:16px;padding:18px;border:1px solid #334155}
.settings-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.settings-header h2{font-size:15px;font-weight:600}
.edit-btn{background:#334155;color:#f1f5f9;border:none;border-radius:8px;padding:5px 13px;font-size:13px;cursor:pointer}
.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.settings-grid label{font-size:13px;color:#94a3b8}
.settings-grid input{display:block;width:100%;margin-top:4px;background:#0f172a;color:#f1f5f9;border:1px solid #334155;border-radius:8px;padding:8px;font-size:15px}
.settings-summary{display:flex;gap:16px;font-size:14px;color:#94a3b8;flex-wrap:wrap}
.settings-summary strong{color:#f1f5f9}
</style>
</head>
<body>
<nav><span class="brand">⚡ Tabutility</span><a href="https://tabutility.com">← All Tools</a></nav>
<div class="ad-banner"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-7039091592734005" data-ad-slot="auto" data-ad-format="auto" data-full-width-responsive="true"></ins><script>(adsbygoogle=window.adsbygoogle||[]).push({});</script></div>
<div id="app">
  <h1>Pomodoro Timer</h1>
  <p class="subtitle">Focus sessions · Short &amp; long breaks · Session tracking</p>
  <div class="mode-tabs" id="mode-tabs">
    <button class="mode-tab" data-mode="work" onclick="switchMode('work')">Focus</button>
    <button class="mode-tab" data-mode="short" onclick="switchMode('short')">Short Break</button>
    <button class="mode-tab" data-mode="long" onclick="switchMode('long')">Long Break</button>
  </div>
  <div class="card">
    <svg id="ring-svg" width="260" height="260" viewBox="0 0 260 260">
      <circle cx="130" cy="130" r="110" fill="none" stroke="#334155" stroke-width="10"/>
      <circle id="ring" cx="130" cy="130" r="110" fill="none" stroke="#ef4444" stroke-width="10"
        stroke-linecap="round" transform="rotate(-90 130 130)"
        stroke-dasharray="691.15" stroke-dashoffset="0"/>
      <text id="timer-txt" x="130" y="145" text-anchor="middle" fill="#f1f5f9" font-size="64" font-family="monospace" font-weight="300">25:00</text>
      <text id="mode-txt" x="130" y="178" text-anchor="middle" font-size="14" font-weight="600" fill="#ef4444">FOCUS</text>
    </svg>
    <div class="btns" id="btns"></div>
    <div class="stats-row">
      <div class="stat"><div class="stat-num" id="cycle-num" style="color:#ef4444">0</div><div class="stat-lbl">this cycle</div></div>
      <div class="stat"><div class="stat-num" id="today-num">0</div><div class="stat-lbl">completed today</div></div>
      <div class="stat"><div class="stat-num" id="mins-num">0 <span style="font-size:14px;color:#64748b">min</span></div><div class="stat-lbl">focused today</div></div>
    </div>
  </div>
  <div class="settings-card">
    <div class="settings-header">
      <h2>Settings</h2>
      <button class="edit-btn" id="edit-btn" onclick="toggleEdit()">Edit</button>
    </div>
    <div id="settings-summary" class="settings-summary"></div>
    <div id="settings-form" class="settings-grid" style="display:none">
      <label>Focus (min)<input type="number" id="cfg-work" min="1" max="120" value="25" onchange="applySettings()"/></label>
      <label>Short break (min)<input type="number" id="cfg-short" min="1" max="60" value="5" onchange="applySettings()"/></label>
      <label>Long break (min)<input type="number" id="cfg-long" min="1" max="120" value="15" onchange="applySettings()"/></label>
      <label>Long break after<input type="number" id="cfg-after" min="1" max="10" value="4" onchange="applySettings()"/></label>
    </div>
  </div>
</div>
<script>
var cfg = { work:25, short:5, long:15, after:4 };
var mode = 'work';
var remaining = 25*60;
var total = 25*60;
var running = false;
var intervalId = null;
var sessions = 0;
var completedToday = 0;
var audioCtx = null;
var CIRC = 2*Math.PI*110;
var COLORS = { work:'#ef4444', short:'#22c55e', long:'#38bdf8' };
var LABELS = { work:'FOCUS', short:'SHORT BREAK', long:'LONG BREAK' };

function getCtx() { if(!audioCtx) audioCtx=new AudioContext(); return audioCtx; }
function beep(freq,dur,delay) {
  try {
    var ctx=getCtx(); var o=ctx.createOscillator(); var g=ctx.createGain();
    o.connect(g); g.connect(ctx.destination); o.frequency.value=freq;
    g.gain.setValueAtTime(0.4,ctx.currentTime+delay);
    g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+delay+dur);
    o.start(ctx.currentTime+delay); o.stop(ctx.currentTime+delay+dur);
  } catch(e){}
}
function playDone(){ beep(523,.15,0); beep(659,.15,.2); beep(784,.3,.4); }

function pad2(n){ return String(n).padStart(2,'0'); }
function totalFor(m){ return cfg[m]*60; }

function updateDisplay() {
  var m=Math.floor(remaining/60); var s=remaining%60;
  document.getElementById('timer-txt').textContent=pad2(m)+':'+pad2(s);
  var pct=total>0?(total-remaining)/total:0;
  document.getElementById('ring').setAttribute('stroke-dashoffset',String(CIRC*pct));
  document.getElementById('ring').setAttribute('stroke',COLORS[mode]);
  document.getElementById('mode-txt').textContent=LABELS[mode];
  document.getElementById('mode-txt').setAttribute('fill',COLORS[mode]);
  document.getElementById('cycle-num').textContent=(sessions%cfg.after)||(sessions>0&&sessions%cfg.after===0?cfg.after:0);
  document.getElementById('cycle-num').style.color=COLORS[mode];
  document.getElementById('today-num').textContent=completedToday;
  document.getElementById('mins-num').innerHTML=Math.floor(completedToday*cfg.work)+' <span style="font-size:14px;color:#64748b">min</span>';
}

function renderTabs() {
  document.querySelectorAll('.mode-tab').forEach(function(t){
    var m=t.getAttribute('data-mode');
    t.style.background=mode===m?COLORS[mode]:'#1e293b';
    t.style.color=mode===m?'#fff':'#94a3b8';
    t.style.borderColor=mode===m?COLORS[mode]:'#334155';
  });
}

function renderBtns() {
  var el=document.getElementById('btns'); el.innerHTML='';
  var col=COLORS[mode];
  if (!running) {
    var b=document.createElement('button'); b.className='btn';
    b.style.background=col; b.style.color='#fff';
    b.textContent='Start'; b.onclick=startTimer; el.appendChild(b);
  } else {
    var p=document.createElement('button'); p.className='btn btn-secondary';
    p.textContent='Pause'; p.onclick=pauseTimer; el.appendChild(p);
  }
  var r=document.createElement('button'); r.className='btn btn-secondary';
  r.style.marginLeft='0';
  r.innerHTML='&#8635;'; r.title='Restart';
  r.onclick=function(){ clearInterval(intervalId); running=false; remaining=total; updateDisplay(); renderBtns(); };
  el.appendChild(r);
}

function startTimer() {
  running=true;
  intervalId=setInterval(function(){
    remaining--;
    updateDisplay();
    if(remaining<=0){
      clearInterval(intervalId); running=false;
      playDone();
      if(mode==='work'){
        sessions++; completedToday++;
        var next=sessions%cfg.after===0?'long':'short';
        switchMode(next);
      } else {
        switchMode('work');
      }
    }
  },1000);
  renderBtns();
}
function pauseTimer(){ clearInterval(intervalId); running=false; renderBtns(); }

function switchMode(m) {
  clearInterval(intervalId); running=false;
  mode=m; total=totalFor(m); remaining=total;
  renderTabs(); updateDisplay(); renderBtns();
}

function toggleEdit() {
  var form=document.getElementById('settings-form');
  var summary=document.getElementById('settings-summary');
  var btn=document.getElementById('edit-btn');
  if(form.style.display==='none'){ form.style.display='grid'; summary.style.display='none'; btn.textContent='Close'; }
  else { form.style.display='none'; summary.style.display='flex'; btn.textContent='Edit'; }
}
function applySettings() {
  cfg.work=parseInt(document.getElementById('cfg-work').value)||25;
  cfg.short=parseInt(document.getElementById('cfg-short').value)||5;
  cfg.long=parseInt(document.getElementById('cfg-long').value)||15;
  cfg.after=parseInt(document.getElementById('cfg-after').value)||4;
  total=totalFor(mode); remaining=total;
  renderSummary(); updateDisplay();
}
function renderSummary() {
  document.getElementById('settings-summary').innerHTML=
    '<span>Focus: <strong>'+cfg.work+'m</strong></span>'+
    '<span>Short: <strong>'+cfg.short+'m</strong></span>'+
    '<span>Long: <strong>'+cfg.long+'m</strong></span>'+
    '<span>Every: <strong>'+cfg.after+'</strong></span>';
}

renderTabs(); updateDisplay(); renderBtns(); renderSummary();
</script>
</body>
</html>
